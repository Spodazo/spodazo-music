<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Spodazo Music</title>
    <meta name="application-name" content="Spodazo Music" />
    <meta name="apple-mobile-web-app-title" content="Spodazo Music" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="msapplication-TileColor" content="#0d1117" />
    <meta name="msapplication-TileImage" content="/android-chrome-192x192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/api/albums" as="fetch" />
    <link rel="preload" href="/api/player-setup" as="fetch" />
    <script>
      (function () {
        function preload(href) {
          if (!href) return;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          document.head.appendChild(link);
        }
        try {
          var setup = JSON.parse(localStorage.getItem("spodazo-home-setup-v1") || "null");
          if (setup && setup.favicon && !document.querySelector('link[rel="icon"][href*="/icon-"]')) {
            var stamp = encodeURIComponent(setup.favicon);
            function iconUrl(file) {
              return "/site-icons/" + stamp + "/" + String(file || "").replace(/^\//, "").split("?")[0];
            }
            document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"], link[rel="manifest"]').forEach(function (link) {
              var href = link.getAttribute("href") || "";
              var file = href.split("?")[0].split("/").pop();
              if (!file) return;
              var next = link.cloneNode(false);
              next.setAttribute("href", iconUrl(file));
              link.parentNode.replaceChild(next, link);
            });
            var tile = document.querySelector('meta[name="msapplication-TileImage"]');
            if (tile) tile.setAttribute("content", iconUrl("android-chrome-192x192.png"));
          }
          if (setup && setup.logoUrl) preload(setup.logoUrl);
          var albums = JSON.parse(localStorage.getItem("spodazo-home-albums-v3") || "[]");
          if (!Array.isArray(albums)) return;
          albums.slice(0, 2).forEach(function (album) {
            if (!album) return;
            preload(album.thumbUrl);
            if (album.heroUrl && album.heroUrl !== album.thumbUrl) preload(album.heroUrl);
          });
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var KEY = "spodazo-music-app-rev";
        var PARAM = "_spodazo";
        var HOLD_MS = 5000;
        var pending = "";
        var lastPlayAt = 0;
        var applying = false;
        var pauseTimer = 0;
        function revision(info) {
          if (!info || !info.build) return "";
          return String(info.build) + ":" + (String(info.catalog || "0") || "0");
        }
        function stored() {
          try {
            return sessionStorage.getItem(KEY) || localStorage.getItem(KEY) || "";
          } catch (e) {
            return "";
          }
        }
        function save(value) {
          try {
            if (value) {
              sessionStorage.setItem(KEY, value);
              localStorage.setItem(KEY, value);
            }
          } catch (e) {}
        }
        function isBusy() {
          var playing = Array.prototype.some.call(document.querySelectorAll("audio"), function (audio) {
            return !audio.paused;
          });
          return playing || (lastPlayAt && performance.now() - lastPlayAt < HOLD_MS);
        }
        function apply(next) {
          var from = stored();
          var fromBuild = from.split(":")[0] || "";
          var toBuild = next.split(":")[0] || "";
          if (!from || !next || from === next) {
            save(next);
            return;
          }
          if (!fromBuild || !toBuild || fromBuild === toBuild) {
            save(next);
            return;
          }
          if (isBusy()) {
            pending = next;
            return;
          }
          applying = true;
          pending = "";
          save(next);
          var url = new URL(location.href);
          url.searchParams.set(PARAM, toBuild.slice(0, 16));
          location.replace(url.pathname + url.search + url.hash);
        }
        function flush() {
          if (!pending || applying || isBusy()) return;
          apply(pending);
        }
        function check() {
          if (applying) return;
          fetch("/api/version", { cache: "no-store", headers: { "Cache-Control": "no-cache", Pragma: "no-cache" } })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (info) {
              var next = revision(info);
              if (next) apply(next);
            })
            .catch(function () {});
        }
        check();
        setInterval(function () {
          if (pending) flush();
          check();
        }, 15000);
        document.addEventListener("visibilitychange", function () {
          if (pending) flush();
          if (!document.hidden) check();
        });
        document.addEventListener("play", function (event) {
          if (event.target instanceof HTMLMediaElement) lastPlayAt = performance.now();
        }, true);
        document.addEventListener("pause", function (event) {
          if (!(event.target instanceof HTMLMediaElement)) return;
          clearTimeout(pauseTimer);
          var elapsed = lastPlayAt ? performance.now() - lastPlayAt : HOLD_MS;
          pauseTimer = setTimeout(flush, Math.max(0, HOLD_MS - elapsed));
        }, true);
        document.addEventListener("ended", function (event) {
          if (event.target instanceof HTMLMediaElement) flush();
        }, true);
        window.addEventListener("pageshow", function () {
          if (pending) flush();
          check();
        });
        window.addEventListener("focus", function () {
          if (pending) flush();
          check();
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=optional"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
