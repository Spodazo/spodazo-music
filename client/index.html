<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Spodazo Music</title>
    <meta name="application-name" content="Spodazo Music" />
    <meta name="apple-mobile-web-app-title" content="Spodazo Music" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="msapplication-TileColor" content="#0d1117" />
    <meta name="msapplication-TileImage" content="/android-chrome-192x192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/api/albums" as="fetch" />
    <link rel="preload" href="/api/player-setup" as="fetch" />
    <script>
      (function () {
        function preload(href) {
          if (!href) return;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          document.head.appendChild(link);
        }
        try {
          var setup = JSON.parse(localStorage.getItem("spodazo-home-setup-v1") || "null");
          if (setup && setup.favicon) {
            var stamp = encodeURIComponent(setup.favicon);
            document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"], link[rel="manifest"]').forEach(function (link) {
              var href = link.getAttribute("href") || "";
              var path = href.split("?")[0];
              if (path) link.setAttribute("href", path + "?v=" + stamp);
            });
            var tile = document.querySelector('meta[name="msapplication-TileImage"]');
            if (tile) tile.setAttribute("content", "/android-chrome-192x192.png?v=" + stamp);
          }
          if (setup && setup.logoUrl) preload(setup.logoUrl);
          var albums = JSON.parse(localStorage.getItem("spodazo-home-albums-v3") || "[]");
          if (!Array.isArray(albums)) return;
          albums.slice(0, 2).forEach(function (album) {
            if (!album) return;
            preload(album.thumbUrl);
            if (album.heroUrl && album.heroUrl !== album.thumbUrl) preload(album.heroUrl);
          });
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=optional"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
